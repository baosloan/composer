# composer配置 — 本地开发默认配置。
#
# 每个键都可以通过环境变量覆盖，环境变量以 APP_ 为前缀，
# 配置路径中的点号替换为下划线：
#
#   APP_SERVER_PORT=9000
#   APP_DATABASE_MODE=cluster
#   APP_KAFKA_CLUSTER_BROKERS=b1:9092,b2:9092,b3:9092   # 列表用逗号分隔
#
# 数据库、Redis 和 Kafka 各自通过 `mode` 字段选择拓扑模式。
# 两种拓扑配置块可以同时存在于文件中：只有被选中的那个会被读取，
# 因此将环境从单节点升级到集群只需修改一个字段。
#
# 运行 `composer config:check` 可验证此配置文件，
# 并打印应用实际将连接的拓扑信息。

app:
  name: composer
  env: local

server:
  host: 0.0.0.0
  port: 8080
  # debug | test | release。release 模式会启用更严格的校验：
  # 会拒绝默认的 JWT 密钥、通配符 CORS 来源、空的数据库密码和 Redis 密码，
  # 以及单 Broker 的 Kafka 配置。
  mode: debug
  base_path: /api

  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  # 必须小于 write_timeout，否则连接会在 504 响应被写入之前断开。
  request_timeout: 10s
  shutdown_timeout: 15s
  max_body_bytes: 4194304 # 4 MiB

  # 信任的 IP/CIDR 列表，用于信任其 X-Forwarded-For 头部。
  # 列表为空时不信任任何来源，此时 ClientIP() 返回的是直连对端地址，
  # 无法绕过限流器伪造 IP。
  # 生产环境请将此配置设置为您的入口/负载均衡器的 IP 范围。
  trusted_proxies: []


log:
  level: info # debug | info | warn | error
  format: console # json | console — release 模式默认使用 json
  output: stdout # stdout | stderr | file
  filename: logs/app.log # 当 output=file 时使用。
  rotate:
    max_size_mb: 100
    max_backups: 7
    max_age_days: 30
    compress: true
  caller: true
  stacktrace: true

cors:
  enabled: true
  # 明确指定的来源列表，而非 "*"。release 模式会拒绝通配符，
  # 浏览器也会拒绝通配符与 allow_credentials 同时使用。
  allow_origins:
    - http://localhost:3000
  allow_methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
  allow_headers: [Origin, Content-Type, Accept, Authorization, X-Request-ID]
  expose_headers: [X-Request-ID]
  allow_credentials: false
  max_age: 12h

rate_limit:
  enabled: true
  # 每个客户端 IP 的稳定每秒请求数（持续速率），以及瞬时突发容量。
  rps: 50
  burst: 100
  # 用于淘汰空闲的客户端令牌桶，防止内存无限增长。
  ttl: 10m

metrics:
  enabled: true
  path: /metrics